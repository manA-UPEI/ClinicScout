name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR so pushes don't queue behind
# stale ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Build first, not last: layout.tsx uses Next's generated LayoutProps
      # type, which only exists once `next build` (or `next dev`) has run at
      # least once and written .next/types/. A typecheck-before-build order
      # only worked locally because .next/types was already warm from
      # earlier dev/build runs — a fresh CI checkout has no such thing.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (includes the Clean Architecture boundary rule)
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Fails the build on a high/critical advisory in a resolved dependency.
      # Dependabot (.github/dependabot.yml) opens the PRs; this is what
      # blocks merging one that doesn't actually fix the thing it claims to.
      - name: Dependency audit
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Every e2e test mocks /api/search at the network layer
      # (playwright.config.ts), so no GEMINI_API_KEY or other secret is
      # needed here — nothing in this job calls a real upstream service.
      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
